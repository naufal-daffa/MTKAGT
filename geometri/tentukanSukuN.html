<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matematika || Geometri</title>
  <link rel="website icon" type="jpg" href="../img/logo.jpg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../style/style.css">
</head>
<body>

  <div class="container-custom landing-page1 justify-content-center">
        <h1>Tentukan Suku ke-n</h1>
        <form id="form-suku-n">
            <div class="mb-3">
                <label for="u1" class="form-label">Masukkan suku pertama (U1)</label>
                <input type="number" class="form-control" id="u1" required>
            </div>
            <div class="mb-3">
                <label for="r" class="form-label">Masukkan rasio (r)</label>
                <input type="number" class="form-control" id="r" required>
            </div>
            <div class="mb-3">
                <label for="un" class="form-label">Masukkan nilai suku yang dicari (Un)</label>
                <input type="number" class="form-control" id="un" required>
            </div>
            <div class="d-flex space">
                <button class="btn-custom mb-3" onclick="location.href='../geometri.html'">Kembali</button>
                <button type="submit" class="btn-custom mb-3">Hitung</button>
            </div>
        </form>
        <div class="card text-bg-light text-center">
            <h4 class="mt-3 mb-3">Hasil: <span id="hasil-suku-n"></span></h2>
        </div>
        <button class="btn-custom mt-3" onclick="window.location.href='history/tentukanSukuN/index.html'">History</button>
  </div>

  <script src="tentukanSukuN.js"></script>
</body>
</html>
