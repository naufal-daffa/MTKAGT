<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matematika || Aritmatika</title>
  <link rel="website icon" type="jpg" href="../img/logo.jpg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../style/style.css">
</head>
<body>

    <div class="container-custom landing-page1 justify-content-center">
        <h1 class="text-center">Cari suku ke-n (Un)</h1>
        <form id="form-suku">
            <div class="mb-3">
                <label for="n" class="form-label">Masukan nilai N</label>
                <input type="text" class="form-control" id="n" required>
            </div>
            <div class="mb-3">
                <label for="u1" class="form-label">Masukkan suku pertama (U1)</label>
                <input type="text" class="form-control" id="u1" required>
            </div>
            <div class="mb-3">
                <label for="beda" class="form-label">Masukkan beda (b)</label>
                <input type="text" class="form-control" id="beda" required>
            </div>
            <div class="d-flex space">
                <button type="submit" class="btn-custom mb-3" onclick="location.href='../aritmatika.html'">Kembali</button>
                <button type="submit" class="btn-custom mb-3">Hitung</button>
            </div>
        </form>
        <div class="card text-bg-light text-center">
            <h4 class="mt-3 mb-3">Hasil: <span id="hasil-suku"></span></h2>
        </div>
        <button class="btn-custom mt-3" onclick="window.location.href='history/cariSuku/index.html'">History</button>
    </div>

<script src="cariSuku.js"></script>

</body>
</html>
